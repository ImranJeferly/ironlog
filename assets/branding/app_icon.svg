<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark techy backdrop -->
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1B1B24"/>
      <stop offset="55%" stop-color="#111117"/>
      <stop offset="100%" stop-color="#08080C"/>
    </radialGradient>
    <!-- Volt neon gradient for the dumbbell -->
    <linearGradient id="volt" x1="286" y1="400" x2="738" y2="624" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EDFF66"/>
      <stop offset="50%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#A6CC00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4FF00" stop-opacity="0.50"/>
      <stop offset="60%" stop-color="#D4FF00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#D4FF00" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Full-bleed background (square; platforms apply their own corner mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Faint inner frame for a HUD / sleek-tech feel -->
  <rect x="70" y="70" width="884" height="884" rx="196"
        fill="none" stroke="#D4FF00" stroke-opacity="0.14" stroke-width="6"/>

  <!-- HUD corner ticks -->
  <g stroke="#D4FF00" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round">
    <path d="M150 246 V150 H246"/>
    <path d="M778 150 H874 V246"/>
    <path d="M874 778 V874 H778"/>
    <path d="M246 874 H150 V778"/>
  </g>

  <!-- Neon glow behind the dumbbell -->
  <ellipse cx="512" cy="512" rx="330" ry="180" fill="url(#glow)"/>

  <!-- Dumbbell = IronLog mark. Blurred copy underneath = glow. -->
  <g filter="url(#soft)" opacity="0.65" fill="url(#volt)">
    <rect x="286" y="400" width="60" height="224" rx="24"/>
    <rect x="346" y="432" width="46" height="160" rx="20"/>
    <rect x="384" y="483" width="256" height="58" rx="29"/>
    <rect x="632" y="432" width="46" height="160" rx="20"/>
    <rect x="678" y="400" width="60" height="224" rx="24"/>
  </g>
  <g fill="url(#volt)">
    <rect x="286" y="400" width="60" height="224" rx="24"/>
    <rect x="346" y="432" width="46" height="160" rx="20"/>
    <rect x="384" y="483" width="256" height="58" rx="29"/>
    <rect x="632" y="432" width="46" height="160" rx="20"/>
    <rect x="678" y="400" width="60" height="224" rx="24"/>
  </g>
  <!-- Inner highlight edges -->
  <g fill="none" stroke="#F6FFCC" stroke-opacity="0.30" stroke-width="4">
    <rect x="286" y="400" width="60" height="224" rx="24"/>
    <rect x="678" y="400" width="60" height="224" rx="24"/>
  </g>
</svg>
