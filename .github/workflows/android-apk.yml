name: Build Android APK

# Builds a debug-signed release APK and publishes it to a GitHub Release
# so it can be downloaded straight onto a phone. Runs on pushes to the
# feature branch and can be triggered manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/android-health-integration-hnyyaw
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Fails on errors only; a quick signal before the (slow) Gradle build.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        # versionCode = run number so each build is a strict upgrade the app
        # (and Android) recognise; the in-app updater compares this number.
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --build-name=1.0.${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/IronLog-${{ github.run_number }}.apk"
          ls -lh dist

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironlog-apk
          path: dist/IronLog-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish APK to a Release (auto-update source)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: IronLog APK (build ${{ github.run_number }})
          body: |
            Debug-signed release APK built from
            `${{ github.ref_name }}` @ `${{ github.sha }}`.

            The app checks these releases and offers a one-tap in-app update.
            To install manually, download **IronLog-${{ github.run_number }}.apk**
            below and open it on your Android device (allow "install from
            unknown sources" if prompted).
          # Not a prerelease, and marked latest, so it's the "current" build the
          # in-app updater and the Releases page surface.
          prerelease: false
          make_latest: true
          files: dist/IronLog-${{ github.run_number }}.apk
